# config/model.yaml (v1.1)
model:
  name: "XGBoost"
  task: "regression"

training:
  test_size: 0.2
  shuffle: false          # CRITICAL: Never shuffle time-series
  target_column: "target"

cross_validation:
  enabled: true
  type: "walk_forward"
  window_size: 1000       # Training window (days)
  step_size: 60           # Retrain every 3 months (approx)
  gap: 5                  # Should match your prediction horizon