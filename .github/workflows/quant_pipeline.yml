name: Quant Pipeline v1.1 (Daily Auto-Run)

on:
  schedule:
    # Runs at 23:00 UTC (6:00 PM EST) every Monday through Friday
    - cron: '0 23 * * 1-5'
  workflow_dispatch: # Allows you to trigger it manually from the GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip' # Caches dependencies to speed up subsequent runs

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute End-to-End Pipeline
        run: python main.py

      - name: Upload Backtest Results
        uses: actions/upload-artifact@v3
        with:
          name: backtest-reports
          path: data/backtests/
          retention-days: 7